acceptance:
  - id: SOP21-REPAIR-01
    observation: Every malformed contract-readiness input fails closed through the
      direct verifier, task contract-review CLI, ledger transition, and graph
      checker with stable structured errors and no TypeError, command execution,
      or task-state mutation.
    positiveCases:
      - A valid canonical review still returns valid true and authorizes only
        its exact accepted contract and distinct reviewer.
      - Null, array, schema-only, missing
        reviewer/contract/checklist/r3Requirements/findings, wrong-type,
        unknown-key, and forged partial records return deterministic invalid
        results.
      - CLI stdout for a readable malformed canonical artifact is JSON with
        valid false, stderr contains no TypeError, and the ledger bytes remain
        unchanged.
    negativeCases:
      - Schema validation records errors but code continues into an unchecked
        nested access.
      - A malformed review throws, produces a stack-only response, authorizes
        IN_PROGRESS, changes the ledger, or is accepted by graph validation.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/lib/node_modules/pnpm/bin/pnpm.cjs
