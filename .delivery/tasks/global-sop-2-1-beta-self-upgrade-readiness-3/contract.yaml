objective: Implement and independently validate a fully specified, task-scoped,
  fail-closed coordinator for one local EngineeringGovernance upgrade from
  pinned 2.0.0 to the closed 2.1.0-beta.0 release. Freeze exact semantic
  verifier outputs, artifact schemas, expiring apply authority, consumption,
  backup, rollback, durable results, CLI arguments, and post-upgrade boundary
  before any real managed-path write occurs.
scope:
  - Preserve readiness-1 and readiness-2 as SUPERSEDED audit history and address
    every consolidated contract finding CR-001 through CR-006.
  - Add scripts/self-upgrade/verify-self-upgrade-readiness.mjs as a read-only
    comparator with exactly pre-upgrade-state and release-binding modes.
  - Add scripts/self-upgrade/apply-reviewed-self-upgrade.mjs as the only apply
    vehicle with exactly verify-only, apply, and recover modes; reject unknown,
    missing, duplicate, reordered, or extra CLI arguments.
  - Add shared implementation only below scripts/self-upgrade plus
    tests/unit/self-upgrade-coordinator.test.ts and
    tests/integration/self-upgrade-coordinator.test.ts; do not change any
    governance identity source.
  - Add task-owned JSON Schemas below
    .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/schemas for
    grant, backup, consumption, and result; every schema uses
    additionalProperties false at every object level.
  - The apply grant canonical path is
    .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-apply-grant.json;
    canonical JSON has exactly schemaVersion, artifactType, grantId, taskId,
    contract, grantor, action, target, plan, archive, writes, issuedAt,
    expiresAt, consumeOnce, and status plus one LF.
  - Grant constants are schemaVersion 1, artifactType
    engineering-governance-self-upgrade-grant-v1, grantId
    eg21-readiness3-apply-1, this taskId, action
    apply-reviewed-local-governance-upgrade, target
    /Users/xgh/Documents/VibeCoding/EngineeringGovernance, issuedAt
    2026-08-15T16:21:57.000Z, expiresAt 2026-08-29T16:21:57.000Z, consumeOnce
    true, and status approved.
  - Grant contract has exactly path, rawSha256, and digest and must equal this
    canonical contract; grantor has exactly id user, role user, trustLevel
    local-claim; plan has exactly digest
    45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c and
    stdoutSha256
    dfc0761686796f8ee7f0efa24b33b1717ff587ae3d4d46efa35b1156b7535f84; archive
    has exactly path and sha256 bound to the released beta archive.
  - Grant writes is an ordered array of exactly five objects, each with exactly
    order, path, beforeSha256, afterSha256, and mode. Orders are 1 through 5;
    mode is always present and is null for policy/extensions/AGENTS, 420 for the
    beta runtime, and 493 for the wrapper; only the beta runtime beforeSha256 is
    null.
  - The task-level readiness-implementation-authorization.json is a standard
    sop-authorization-v2 document for AUTH-EG21-READINESS-IMPLEMENTATION,
    grantor user/local-claim, the same issuedAt/expiresAt window, and scope
    limited to implementing and testing these files without real apply.
    Candidate verification must reference and consume this task authorization
    exactly once; it is not the upgrade apply grant.
  - Backup directory is
    .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-backup.
    Manifest path is upgrade-backup/manifest.json and canonical JSON has exactly
    schemaVersion, artifactType, taskId, contract, grant, planDigest, createdAt,
    and entries plus one LF.
  - Backup constants are schemaVersion 1 and artifactType
    engineering-governance-self-upgrade-backup-v1. Contract has exactly path,
    rawSha256, digest; grant has exactly path, sha256; entries is exactly five
    ordered objects with order, path, state, sourceSha256, sourceMode,
    backupPath, backupSha256.
  - Present backup entries require state present, exact source SHA, numeric
    sourceMode, task-relative backupPath, matching backupSha256 and
    byte-identical backup file. Exact backup files are
    upgrade-backup/01-policy.yaml, 02-extensions.yaml, 03-AGENTS.md, and
    05-check-delivery-policy.sh. Their frozen source modes are 420, 420, 420,
    and 493. The beta runtime entry is order 4, state absent, and all four
    sourceSha256/sourceMode/backupPath/backupSha256 values are null.
  - Consumption path is
    .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-consumption.json
    and canonical JSON has exactly schemaVersion, artifactType, consumptionId,
    taskId, contract, grant, backup, planDigest, archiveSha256, attemptedAt, and
    status plus one LF.
  - Consumption constants are schemaVersion 1, artifactType
    engineering-governance-self-upgrade-consumption-v1, consumptionId
    eg21-readiness3-consumption-1, this taskId, status consumed, exact contract
    raw/digest, exact grant and backup path/SHA references, exact plan digest
    and archive SHA. The file is created with exclusive create and
    file/directory fsync after all backups validate and before the first managed
    write; its existence permanently consumes the grant regardless of outcome.
  - Result path is
    .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-result.json
    and canonical JSON has exactly schemaVersion, artifactType, resultId,
    taskId, consumption, outcome, appliedPaths, postcheck, recovery, completedAt
    plus one LF.
  - Result constants are schemaVersion 1, artifactType
    engineering-governance-self-upgrade-result-v1, resultId
    eg21-readiness3-result-1, this taskId, exact consumption path/SHA; outcome
    enum is SUCCEEDED, ROLLED_BACK, or RECOVERY_REQUIRED; appliedPaths is an
    ordered unique subset of the five managed relative paths.
  - Result postcheck has exactly attempted, command, exitCode, stdoutPath,
    stdoutSha256, stderrPath, stderrSha256, policyVersion, policyDigest. Result
    recovery has exactly attempted, completed, command, exitCode, stdoutPath,
    stdoutSha256, stderrPath, stderrSha256. Non-applicable values are null;
    applicable output paths and hashes must bind durable files.
  - Durable beta postcheck files are upgrade-postcheck.stdout.json and
    upgrade-postcheck.stderr.txt. Durable old-runner recovery files are
    upgrade-recovery.stdout.json and upgrade-recovery.stderr.txt. All live below
    the readiness-3 task directory, are regular non-symlink files, and are
    raw-SHA bound by result.json.
  - Verify-only argv is exactly node
    scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode verify-only
    --project /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id
    global-sop-2-1-beta-self-upgrade-readiness-3 --grant
    /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-apply-grant.json.
  - Apply argv is exactly node
    scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode apply --project
    /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id
    global-sop-2-1-beta-self-upgrade-readiness-3 --grant
    /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-apply-grant.json
    --archive
    /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0/engineering-governance-2.1.0-beta.0.tgz
    --plan-digest
    45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c.
  - Recover argv is exactly node
    scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode recover
    --project /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id
    global-sop-2-1-beta-self-upgrade-readiness-3 --consumption
    /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-3/upgrade-consumption.json.
  - Verify-only is read-only and permitted during IN_PROGRESS. Apply requires
    this task CLOSED, active unconsumed grant, exact independent
    review/candidate/verification/closure bindings, exact archive/plan/before
    identities, complete fsynced backup, and absent consumption/result files.
  - Apply creates consumption before mutation, executes the exact beta plan
    once, captures durable beta wrapper output, and records SUCCEEDED only when
    the pinned beta wrapper returns valid true, errors empty, version
    2.1.0-beta.0 and the exact beta policy digest.
  - Any apply/postcheck failure restores managed paths in reverse order to exact
    backup bytes/modes/absence, captures the restored old pinned 2.0.0 wrapper
    output, and records ROLLED_BACK only when restoration and old check pass;
    otherwise record RECOVERY_REQUIRED and stop.
  - Recover is allowed only when consumption exists and success is absent; it
    never applies the beta plan, may run after grant expiry, is idempotent after
    ROLLED_BACK, restores from the bound backup, captures old check output, and
    can only produce ROLLED_BACK or RECOVERY_REQUIRED.
  - Any consumption file makes verify-only/apply/retry fail. A failed or
    interrupted attempt requires recover; a ROLLED_BACK or RECOVERY_REQUIRED
    result requires a new independently reviewed task and grant before any
    future apply.
  - Post-success, immediately start a separate beta-pinned schema-v2 validation
    task; do not access ProjTrav or another consumer until that task is
    independently accepted and CLOSED.
nonGoals:
  - Do not apply the real upgrade, create consumption/backup/result artifacts,
    or run recover inside this readiness task or its evidence commands.
  - Do not alter src, dist, schemas, adapters, templates, skills, VERSION,
    package.json, scripts/build-runner-bundle.mjs, released archive bytes,
    release-6 artifacts, or any governance identity source.
  - Do not create the beta post-upgrade task before a successful apply, and do
    not migrate ProjTrav, NoMe, or any consumer in this task.
  - Do not publish, push, deploy, restart services, mutate persistent data,
    communicate externally, access remote systems, or inspect TREK
    implementation material.
  - Do not infer broader/standing authority, reissue or extend the frozen grant,
    reuse a consumed grant, silently replan, or continue after
    RECOVERY_REQUIRED.
