acceptance:
  - id: EG21-PRE-UPGRADE-STATE-EXACT
    observation: 'The comparator executes and parses the installed pinned wrapper
      and fails unless valid is true, errors is exactly empty, release-6 is
      CLOSED, readiness-1 and readiness-2 are SUPERSEDED, and the installed
      policy is exactly 2.0.0. Exact UTF-8 stdout is this ASCII JSON followed by
      one LF and no other bytes:
      {"valid":true,"check":"pre-upgrade-state","sopVersion":"2.0.0","release6":"CLOSED","readiness1":"SUPERSEDED","readiness2":"SUPERSEDED"}'
    positiveCases:
      - Exact comparator output and empty stderr are reproducible on the
        unchanged project
    negativeCases:
      - Nonempty wrapper output
      - omitted task
      - wrong state/version
      - nonempty errors
      - stale JSON
      - or source beta check substitutes for parsed comparison
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/Cellar/node@22/22.23.1/bin/node
      arguments:
        - scripts/self-upgrade/verify-self-upgrade-readiness.mjs
        - --mode
        - pre-upgrade-state
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
      executableSha256: 9eb69bb1886d409b3f34064f0c81e146b3a31e240faba29b3db5f6d94587e96e
    observerPolicy:
      expectedExitCode: 0
      output: exact
