observation: >-
  The accepted repair-3 contract requires one canonical authorization file to
  serve both as the pinned 2.0.0 lifecycle authorization and as the new beta1
  remediation authorization. The two authoritative validators accept mutually
  exclusive exact-key schemas, so no file can satisfy both and the task cannot
  produce a candidate that its pinned runner can verify.
