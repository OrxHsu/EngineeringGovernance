incompatibility:
  - The pinned candidate verifier requires the canonical authorization path to contain schemaVersion 2 and artifactType sop-authorization-v2 with contractDigest and without remediation-only keys.
  - The repair-3 contract requires that same canonical path to contain artifactType engineering-governance-remediation-authorization-v1 with contract, supervisorId, reviewer IDs, and consumeOnce, and without contractDigest.
  - Both schema variants set additionalProperties false, so satisfying either exact key set invalidates the other.
consequence: >-
  repair-3 is not closable under the project-pinned runner. Existing source and
  test work is not accepted implementation evidence and no CANDIDATE transition
  may be recorded for this contract.
requiredReplacement:
  taskId: global-sop-2-1-beta-1-fix-1-repair-4
  requirements:
    - Preserve repair-3 and this defect artifact as immutable predecessor evidence and transition repair-3 only to SUPERSEDED.
    - Use one standard sop-authorization-v2 artifact at the pinned runner's canonical authorization path for the repair-4 lifecycle requirement.
    - Use a separate engineering-governance-remediation-authorization-v1 sidecar for supervisor, reviewer, contract, scope, expiry, and consume-once remediation semantics.
    - Bind the sidecar to the lifecycle authorization path, raw SHA-256, semantic digest, requirement ID, task, accepted contract, supervisor, and both independent reviewer IDs.
    - The pinned candidate authorizationArtifacts set references only the standard lifecycle authorization; source bootstrap and accountability verification validate the sidecar independently.
    - Derive remediation eligibility from the exact frozen repair-4 contract, predecessor defect binding, lifecycle authorization, and sidecar identities. A task ID hardcode or matching action string alone must never grant eligibility.
    - Require adversarial rejection of omitted, empty, duplicated, swapped, stale, forged, cross-task, cross-contract, wrong-reviewer, wrong-supervisor, wrong-path, wrong-digest, expired, and multiply consumed artifacts.
    - Obtain a fresh independent R3 contract review before implementation resumes.
