objective: Produce independently reviewed, one-time local authorization for
  EngineeringGovernance to upgrade its pinned governance runner from 2.0.0 to
  the closed and independently accepted 2.1.0-beta.0 release candidate. Freeze
  the exact dry-run plan and recovery boundary before any adoption write occurs.
scope:
  - Verify the current pinned 2.0.0 project policy and complete task graph
    before upgrade.
  - Bind the closed release-6 contract, candidate, verification, independent
    review, closure, archive receipt, release record, and exact beta archive
    bytes.
  - Recompute the beta upgrade dry-run and require plan digest
    45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c.
  - Require the plan to write exactly .delivery/policy.yaml,
    .delivery/extensions.yaml, AGENTS.md,
    .delivery/runtime/engineering-governance-2.1.0-beta.0.tgz, and
    .delivery/bin/check-delivery-policy.sh, with no generated targets.
  - Require before/after digests to match the reviewed dry-run, including beta
    archive SHA-256
    9a53b39b3cdeda7ddc7a36b06bb6bf57aa163f13bcfe10e64b1ff094fef06447.
  - Authorize exactly one application of that reviewed plan only after this
    readiness task reaches CLOSED.
  - Preserve the old .delivery/runtime/engineering-governance-2.0.0.tgz archive
    and all historical task artifacts without rewriting them.
  - After apply, require an immediate pinned-beta check and a separate schema-v2
    post-upgrade validation task before any consumer migration.
  - If apply or postcheck fails, stop consumer work and use the preserved 2.0.0
    archive to produce a fresh, independently reviewed rollback plan; never
    guess or reuse a stale rollback digest.
nonGoals:
  - Do not apply the upgrade plan inside this readiness task.
  - Do not create the post-upgrade validation task before the reviewed plan is
    applied.
  - Do not modify or migrate ProjTrav, NoMe, or any other consumer project.
  - Do not publish, push, deploy, restart services, mutate persistent data,
    communicate externally, or inspect TREK implementation material.
  - Do not delete the 2.0.0 runtime archive, rewrite v1 history, or alter
    CLOSED, CANCELLED, or SUPERSEDED v2 evidence.
  - Do not silently replan if any managed before-digest or release identity
    changes.
