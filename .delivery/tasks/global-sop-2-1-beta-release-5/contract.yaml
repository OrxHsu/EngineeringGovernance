scope:
  - Defensively reject null, arrays, schema-only documents, missing nested
    objects, wrong types, unknown keys, and forged partial contract reviews
    through verifier, CLI, ledger, and graph paths without TypeError, execution,
    or ledger mutation.
  - Preserve CLOSED, CANCELLED, and SUPERSEDED v2 history across policy upgrades
    while rejecting every non-terminal stale-policy task.
  - Add exact machine-readable schemas and semantic validators for the durable
    prior-finding record and runner-produced beta release record.
  - Add one verifier that builds the beta runner twice in separate temporary
    directories, compares bytes and SHA-256, validates required archive
    identity/content, and installs only the verified bytes at the declared local
    release path.
  - Add adversarial unit/integration tests for malformed readiness inputs, both
    record schemas, semantic binding, cumulative range completeness, and archive
    nondeterminism.
  - Bump VERSION and package.json to exactly 2.1.0-beta.0 and update README.md
    only after this task enters IN_PROGRESS.
  - Record the reported P1 finding against commit
    75e70217f11388a37595dd1dcbbbae9a4a38861d without relabeling that commit as
    accepted.
