    observation: Prior-finding and beta release records use exact schemas, exact key
      sets, canonical JSON/YAML semantics, and cross-field binding; empty,
      duplicate, reordered, unknown-key, wrong-type, stale, forged, or
      cross-candidate records are rejected.
    positiveCases:
      - The prior record is exactly schemaVersion 1, artifactType
        engineering-governance-prior-review-finding-v1, recordId,
        reviewedImplementation, reporter, decision, acceptanceStatus, finding,
        reproduction, and recordedAt.
      - reviewedImplementation is exactly repository, commit, and tree and binds
        commit 75e70217f11388a37595dd1dcbbbae9a4a38861d with tree
        98bd5a8b14020b15f35f5687de9303b0d5e5e8f2; reporter is local-claim
        independent-implementation-reviewer; decision is REPAIR_REQUIRED;
        acceptanceStatus is not-accepted.
      - finding is exactly id P1, severity BLOCKER, classification
        newly_discovered_defect, non-empty observation and requiredChange;
        reproduction contains the exact schema-only malformed YAML input and
        non-empty TypeError failure observed before repair.
      - The release record is canonical JSON plus one LF with exact keys
        schemaVersion, artifactType, taskId, contract, sourceRange, archive,
        sourceIdentity, publicationStatus, and priorFinding. It binds this exact
        task/contract path/raw SHA/digest; recomputed base/candidate commit and
        tree; every ordered commit/tree entry; archive
        filename/path/SHA/version; package.json and VERSION value;
        local-unpublished; and prior record path/raw SHA/semantic digest.
    negativeCases:
