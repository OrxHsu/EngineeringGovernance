scope:
  - Add complete defensive guards so direct verifier, ledger, graph, and CLI
    contract-readiness paths reject null, arrays, schema-only documents, missing
    nested objects, wrong types, unknown keys, and forged partial records
    without TypeError, command execution, or ledger mutation.
  - Preserve terminal v2 history across policy upgrades while every non-terminal
    stale-policy task remains rejected.
  - Add adversarial unit/integration coverage for malformed contract-review
    artifacts and the cumulative range check.
  - Bump VERSION and package.json from 2.0.0 to exactly 2.1.0-beta.0 only after
    this task enters IN_PROGRESS, and update README.md release identity.
  - Record the prior independently reported P1 finding for
    75e70217f11388a37595dd1dcbbbae9a4a38861d as a durable audit record without
    relabeling it as accepted.
  - Rebuild the local unpublished beta archive in
    /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0
    and emit one canonical release record bound to the exact source range,
    archive, package identity, and publication status.
  - Do not apply the self-upgrade plan in this task; a separate reviewed
    migration chain must bind the exact archive SHA and plan digest, close its
    pre-upgrade authorization task, apply once, and verify the new pin.
nonGoals:
  - Do not publish, push, deploy, restart services, migrate persistent data, or
    communicate externally.
  - Do not adopt or modify ProjTrav, NoMe, or another consumer project in this
    task.
  - Do not rewrite historical v1 or v2 task contracts, ledgers, candidates,
    reviews, closures, or evidence.
  - Do not inspect, adapt, copy, or authorize TREK implementation material.
  - Do not put a mutable external Markdown summary or a future final review
