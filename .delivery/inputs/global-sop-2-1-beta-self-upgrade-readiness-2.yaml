schemaVersion: 2
taskId: global-sop-2-1-beta-self-upgrade-readiness-2
implementationOwner: codex
objective: >-
  Implement and independently validate a task-scoped, fail-closed coordinator
  for the one-time local EngineeringGovernance upgrade from pinned 2.0.0 to the
  closed 2.1.0-beta.0 release. Freeze exact plan and release semantics, an
  expiring recorded-claim apply grant, consumption records, rollback behavior,
  and the post-upgrade validation boundary before any upgrade write occurs.
scope:
  - Preserve readiness-1 as SUPERSEDED audit history and address CR-001 through CR-005 without rewriting its contract.
  - Add scripts/self-upgrade/verify-release-binding.mjs as a read-only semantic verifier for the exact closed release-6 artifacts, source range, receipt, release record, and archive bytes.
  - Add scripts/self-upgrade/apply-reviewed-self-upgrade.mjs as the only authorized apply vehicle; it must have verify-only, apply, and recover modes and must reject every unrecognized argument or unknown key.
  - Add exact task-owned schemas for an engineering-governance-self-upgrade-grant-v1 document and an engineering-governance-self-upgrade-consumption-v1 record without changing the released runner schemas or governance identity.
  - Freeze the direct beta dry-run stdout byte identity, parsed plan digest 45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c, five ordered writes, modes, and generatedTargets empty.
  - Freeze the beta archive path and SHA-256 9a53b39b3cdeda7ddc7a36b06bb6bf57aa163f13bcfe10e64b1ff094fef06447 and release-record raw SHA-256 dc9f034f9622d0e466d310f9e6c95ed1a2e0a8b0fd76c01eb9245367fa76d700.
  - Create one apply grant at .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-2/upgrade-apply-grant.json with grantor user, role user, trustLevel local-claim, consumeOnce true, issuedAt 2026-08-15T16:21:57.000Z, expiresAt 2026-08-29T16:21:57.000Z, exact task/contract/plan/archive/write bindings, and no broader authority.
  - The task-level authorization requirement authorizes only implementation and verification of the coordinator; it does not authorize applying the upgrade.
  - The coordinator may apply only after this readiness task is CLOSED and only while the grant is active, unconsumed, byte-valid, and bound to the exact closed contract, independent review, candidate verification, closure, plan, archive, and five managed before identities.
  - Before apply, persist a complete task-owned backup manifest and byte/mode backups for every existing managed path, plus absence state for the new beta runtime; atomically mark the grant consumption attempt before the first managed write.
  - On any apply or beta postcheck failure, fail closed, restore every managed path to its exact before bytes/mode or absence, verify the old pinned 2.0.0 wrapper, retain the consumed failed attempt and recovery evidence, and require a new reviewed task before retry.
  - On success, require the pinned beta wrapper to return valid true, record exactly one successful consumption result, and reject every replay of the grant or old plan digest.
  - After successful apply, create a separate beta-pinned schema-v2 post-upgrade validation task before any ProjTrav or other consumer migration.
nonGoals:
  - Do not apply the real upgrade inside this readiness task or its evidence commands.
  - Do not alter src, dist, VERSION, package.json, released schemas, released archive bytes, release-6 artifacts, or governance identity sources.
  - Do not create or start the post-upgrade validation task before a successful coordinator apply.
  - Do not modify ProjTrav, NoMe, any other consumer, remote system, registry, deployment, service, database, or external communication.
  - Do not inspect, adapt, copy, or authorize TREK implementation material.
  - Do not infer standing authorization, silently replan, retry a consumed grant, reuse a stale digest, or continue after incomplete recovery.
