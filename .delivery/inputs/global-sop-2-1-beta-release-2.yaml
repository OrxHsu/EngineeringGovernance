  - src/project/task-graph.ts
  - src/commands/task-contract-review-v2.ts
  - src/cli/main.ts
  - tests/unit/contract-readiness.test.ts
  - tests/unit/task-ledger-v2.test.ts
  - tests/unit/task-graph-v2.test.ts
  - tests/integration/cli-v2-hardening.test.ts
  - scripts/build-runner-bundle.mjs
  - /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0/RELEASE-MANIFEST.md
  - Independent implementation finding P1 for commit 75e70217f11388a37595dd1dcbbbae9a4a38861d, reproduced locally with a schema-only canonical contract-review artifact.
repositories:
  - id: root
    path: /Users/xgh/Documents/VibeCoding/EngineeringGovernance
acceptance:
  - id: SOP21-REPAIR-01
    observation: >-
      Every malformed contract-readiness input fails closed through the direct
      verifier, task contract-review CLI, ledger transition, and graph checker
      with stable structured errors and no TypeError, command execution, or
      task-state mutation.
    positiveCases:
      - A valid canonical review still returns valid true and authorizes only its exact accepted contract and distinct reviewer.
      - Null, array, schema-only, missing reviewer/contract/checklist/r3Requirements/findings, wrong-type, unknown-key, and forged partial records return deterministic invalid results.
      - CLI stdout for a readable malformed canonical artifact is JSON with valid false, stderr contains no TypeError, and the ledger bytes remain unchanged.
    negativeCases:
      - Schema validation records errors but code continues into an unchecked nested access.
      - A malformed review throws, produces a stack-only response, authorizes IN_PROGRESS, changes the ledger, or is accepted by graph validation.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments:
        - exec
        - vitest
        - run
        - tests/unit/contract-readiness.test.ts
        - tests/unit/task-ledger-v2.test.ts
        - tests/unit/task-graph-v2.test.ts
        - tests/integration/cli-v2-hardening.test.ts
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
    observerPolicy:
      expectedExitCode: 0
      output: nonempty
      checkoutMutation: forbidden
      replay: required
  - id: SOP21-RELEASE-01
    observation: >-
      The exact cumulative source candidate passes the complete Node 22 package
      check with no skipped required gate and preserves all contract-readiness,
      trust, migration, and evidence invariants.
    positiveCases:
      - pnpm check passes typecheck, the complete unit/integration/adversarial suite, build, placeholder validation, and license validation from the exact candidate checkout.
      - The terminal-history upgrade regression passes while a DEFINED stale-policy task remains rejected.
    negativeCases:
      - A required suite is skipped, dist differs from source, or an active stale-policy task is grandfathered.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [check]
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
    observerPolicy:
      expectedExitCode: 0
      output: nonempty
      checkoutMutation: forbidden
      replay: required
  - id: SOP21-RELEASE-02
    observation: >-
      The unchanged source candidate reproducibly builds exactly one local
      unpublished engineering-governance-2.1.0-beta.0.tgz archive and reports
      its non-empty SHA-256.
    positiveCases:
      - VERSION, package.json, archive metadata, archive VERSION, source, dist, schemas, templates, and dependencies all identify and match 2.1.0-beta.0.
      - Rebuilding from the unchanged candidate produces the same archive SHA-256.
    negativeCases:
      - A 2.0.0, differently named, source-mismatched, symlinked, incomplete, or nondeterministic archive is accepted.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/opt/node@22/bin/node
      arguments:
        - scripts/build-runner-bundle.mjs
        - --output
        - /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0
        - --version
        - 2.1.0-beta.0
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
    observerPolicy:
      expectedExitCode: 0
      output: nonempty
      checkoutMutation: forbidden
      replay: required
  - id: SOP21-RELEASE-03
    observation: >-
      The beta source validates the exact frozen archive and emits one complete,
      stable, dry-run EngineeringGovernance self-upgrade plan without applying it.
    positiveCases:
      - The plan binds beta identity, archive SHA-256, policy, adapter, empty extension manifest, runner path, wrapper mode, and generated-target guards.
      - Replanning without managed-file drift produces the same digest.
    negativeCases:
      - Archive drift, changed managed files, missing runner content, plan-digest instability, or any dry-run write is accepted.
    evidenceKind: static
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments:
        - sop
        - --
        - upgrade
        - /Users/xgh/Documents/VibeCoding/EngineeringGovernance
        - --runner-bundle
        - /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0/engineering-governance-2.1.0-beta.0.tgz
        - --json
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
    observerPolicy:
      expectedExitCode: 0
      output: nonempty
      checkoutMutation: forbidden
      replay: required
  - id: SOP21-RELEASE-04
    observation: >-
      Before the reviewed upgrade is applied, the project-pinned 2.0.0 runner
      still validates the old policy and complete task graph.
    positiveCases:
      - The pinned wrapper returns valid true with no errors and reports this release task's real ledger state.
    negativeCases:
      - Source-only success substitutes for the pinned runner, or policy, adapter, archive, graph, or wrapper drift is ignored.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: ./.delivery/bin/check-delivery-policy.sh
      arguments: []
      environment:
        PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin
    observerPolicy:
      expectedExitCode: 0
      output: nonempty
      checkoutMutation: forbidden
      replay: required
