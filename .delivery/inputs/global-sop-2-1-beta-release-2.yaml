schemaVersion: 2
taskId: global-sop-2-1-beta-release-2
implementationOwner: codex
objective: >-
  Repair the last fail-closed contract-readiness input defect, then formally
  authorize the local Engineering Governance 2.1.0-beta.0 release and the
  repository's own reviewed upgrade from its repaired 2.0.0 pin. Bind the exact
  cumulative implementation since independently accepted commit
  75e70217f11388a37595dd1dcbbbae9a4a38861d, a reproducible beta archive and
  SHA-256, the release manifest, and one dry-run-first self-upgrade plan.
scope:
  - Make direct verifier, ledger, graph, and CLI contract-readiness paths reject null, arrays, schema-only documents, missing nested objects, wrong types, unknown keys, and forged partial records without TypeError, unstructured crash, command execution, or ledger mutation.
  - >-
    Preserve the terminal-v2-history migration repair: CLOSED, CANCELLED, and
    SUPERSEDED history remains checkable after policy upgrade, while every
    non-terminal stale-policy task is rejected.
  - Bump VERSION and package.json from 2.0.0 to exactly 2.1.0-beta.0 only after this task enters IN_PROGRESS, and update README.md release identity.
  - Rebuild the local unpublished beta archive in /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0 and record its exact SHA-256 and independent-review decisions in RELEASE-MANIFEST.md.
  - Produce and independently review the exact EngineeringGovernance self-upgrade plan before applying it after this authorization task is CLOSED.
nonGoals:
  - Do not publish, push, deploy, restart services, migrate persistent data, or communicate externally.
  - Do not adopt or modify ProjTrav, NoMe, or another consumer project in this task.
  - Do not rewrite historical v1 or v2 task contracts, ledgers, candidates, reviews, closures, or evidence.
  - Do not inspect, adapt, copy, or authorize TREK implementation material.
  - Do not weaken reviewer independence, exact contract binding, active-task policy identity, authorization, provenance, replay, or evidence integrity.
authorityInputs:
  - CORE_INVARIANTS.md
  - DEVELOPMENT_SOP.md
  - RISK_CLASSIFICATION.md
  - MIGRATING_TO_2.0.md
  - README.md
