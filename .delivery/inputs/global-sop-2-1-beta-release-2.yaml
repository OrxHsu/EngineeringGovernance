    action: apply-reviewed-local-governance-upgrade
    target: /Users/xgh/Documents/VibeCoding/EngineeringGovernance
    scope:
      - Apply exactly one unchanged dry-run plan digest after this task is independently accepted and closed.
      - Mutate only the EngineeringGovernance policy, adapter managed block, empty extension manifest, pinned local runner archive, and wrapper named by that plan.
      - Keep the release local and unpublished; exclude all consumer projects, remote systems, deployments, services, databases, and external communication.
