schemaVersion: 2
taskId: global-sop-2-1-beta-self-upgrade-readiness-4
implementationOwner: codex
objective: >-
  Implement and independently validate a fully specified, task-scoped,
  fail-closed coordinator for one local EngineeringGovernance upgrade from
  pinned 2.0.0 to the closed 2.1.0-beta.0 release. Freeze exact semantic
  verifier outputs, artifact schemas and filenames, expiring apply authority,
  consumption, backup, rollback, durable results, CLI arguments, beta policy
  identity, and post-upgrade boundary before any real managed-path write.
scope:
  - Preserve readiness-1, readiness-2, and readiness-3 as SUPERSEDED audit history and address all consolidated contract findings through readiness-3 CR-004.
  - Add scripts/self-upgrade/verify-self-upgrade-readiness.mjs as a read-only comparator with exactly pre-upgrade-state and release-binding modes.
  - Add scripts/self-upgrade/apply-reviewed-self-upgrade.mjs as the only apply vehicle with exactly verify-only, apply, and recover modes; reject unknown, missing, duplicate, reordered, or extra CLI arguments.
  - Add shared implementation only below scripts/self-upgrade plus tests/unit/self-upgrade-coordinator.test.ts and tests/integration/self-upgrade-coordinator.test.ts; do not change any governance identity source.
  - Create exactly four task-owned schemas at .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/schemas/engineering-governance-self-upgrade-grant-v1.schema.json, engineering-governance-self-upgrade-backup-v1.schema.json, engineering-governance-self-upgrade-consumption-v1.schema.json, and engineering-governance-self-upgrade-result-v1.schema.json. Each uses JSON Schema draft 2020-12 and additionalProperties false at every object level.
  - The apply grant canonical path is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-apply-grant.json. Canonical JSON has exactly schemaVersion, artifactType, grantId, taskId, contract, grantor, action, target, plan, archive, writes, issuedAt, expiresAt, consumeOnce, and status plus one LF.
  - Grant constants are schemaVersion 1, artifactType engineering-governance-self-upgrade-grant-v1, grantId eg21-readiness4-apply-1, this taskId, action apply-reviewed-local-governance-upgrade, target /Users/xgh/Documents/VibeCoding/EngineeringGovernance, issuedAt 2026-08-15T16:21:57.000Z, expiresAt 2026-08-29T16:21:57.000Z, consumeOnce true, and status approved.
  - Grant contract has exactly path, rawSha256, and digest; path is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/contract.yaml and hashes equal this canonical contract. Grantor is exactly id user, role user, trustLevel local-claim. Plan is exactly digest 45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c and stdoutSha256 dfc0761686796f8ee7f0efa24b33b1717ff587ae3d4d46efa35b1156b7535f84. Archive is exactly path /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0/engineering-governance-2.1.0-beta.0.tgz and sha256 9a53b39b3cdeda7ddc7a36b06bb6bf57aa163f13bcfe10e64b1ff094fef06447.
  - Grant writes is an ordered array of exactly five objects with exactly order, path, beforeSha256, afterSha256, and mode. Every path is the absolute path emitted by the reviewed plan; mode is always present and is either null or the exact decimal integer below.
  - Grant write 1 uses path /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/policy.yaml, beforeSha256 afc8b02db177efe840aa095580e7d6d99c3cff454488591751727621d42769bc, afterSha256 31230b6e5f850adbb9909d0a2e46cd0cfb93fd4c2c59a707d8438a71c83ce92a, and mode null.
