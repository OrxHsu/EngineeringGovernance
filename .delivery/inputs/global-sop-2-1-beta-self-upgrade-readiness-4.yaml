  - Grant write 3 uses path /Users/xgh/Documents/VibeCoding/EngineeringGovernance/AGENTS.md, beforeSha256 b30d9bbdd951af144c397547ee86b3121bf869d58d6f7cafab26b382fe44a8b2, afterSha256 f1c12e3345707dce3328631209cb3f795a4e2c57cc5e0bd5e9a9affe4ce7b033, and mode null.
  - Grant write 4 uses path /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/runtime/engineering-governance-2.1.0-beta.0.tgz, beforeSha256 null, afterSha256 9a53b39b3cdeda7ddc7a36b06bb6bf57aa163f13bcfe10e64b1ff094fef06447, and mode 420.
  - Grant write 5 uses path /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/bin/check-delivery-policy.sh, beforeSha256 e6cedeb03631ca96a664ce65adfa45f5a8151c348b711cb847d7b17cba302ba7, afterSha256 e6cedeb03631ca96a664ce65adfa45f5a8151c348b711cb847d7b17cba302ba7, and mode 493.
  - The task authorization canonical path is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/authorizations/AUTH-EG21-READINESS-IMPLEMENTATION.json. It is canonical JSON plus one LF and has exactly schemaVersion, artifactType, authorizationId, requirementId, taskId, contractDigest, grantor, action, target, scope, issuedAt, expiresAt, and status; attestation is absent.
  - Task authorization constants are schemaVersion 2, artifactType sop-authorization-v2, authorizationId eg21-readiness4-implementation-authorization-1, requirementId AUTH-EG21-READINESS-IMPLEMENTATION, this taskId, this contractDigest, grantor exactly id user, role user, trustLevel local-claim, action/target/scope exactly equal the contract authorization requirement, the same issuedAt/expiresAt window, and status approved. The DEFINED to IN_PROGRESS event references this canonical authorization exactly once; candidate verification must reject any other path, identity, scope, digest, time, trust, occurrence count, or unknown key. This task authorization does not authorize the real upgrade.
  - Backup directory is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-backup. Manifest path is upgrade-backup/manifest.json and canonical JSON has exactly schemaVersion, artifactType, taskId, contract, grant, planDigest, createdAt, and entries plus one LF.
  - Backup constants are schemaVersion 1 and artifactType engineering-governance-self-upgrade-backup-v1. Contract has exactly path, rawSha256, digest using the project-relative canonical contract path; grant has exactly path, sha256 using the project-relative canonical grant path; entries is exactly five ordered objects with order, path, state, sourceSha256, sourceMode, backupPath, backupSha256.
  - Backup entry paths are the same five absolute managed paths as grant writes. Present entries require state present, exact source SHA, numeric sourceMode, task-directory-relative backupPath, matching backupSha256 and byte-identical regular non-symlink file. Exact backup files are upgrade-backup/01-policy.yaml, 02-extensions.yaml, 03-AGENTS.md, and 05-check-delivery-policy.sh; frozen source modes are 420, 420, 420, and 493. Entry 4 has state absent and sourceSha256, sourceMode, backupPath, backupSha256 all null.
  - Consumption path is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-consumption.json and canonical JSON has exactly schemaVersion, artifactType, consumptionId, taskId, contract, grant, backup, planDigest, archiveSha256, attemptedAt, and status plus one LF.
  - Consumption constants are schemaVersion 1, artifactType engineering-governance-self-upgrade-consumption-v1, consumptionId eg21-readiness4-consumption-1, this taskId, status consumed, contract exactly path/rawSha256/digest, grant and backup exactly project-relative path/sha256, plan digest 45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c, and archive SHA 9a53b39b3cdeda7ddc7a36b06bb6bf57aa163f13bcfe10e64b1ff094fef06447. The file is exclusive-created and file/directory-fsynced after all backups validate and before the first managed write; its existence permanently consumes the grant.
  - Result path is .delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-result.json and canonical JSON has exactly schemaVersion, artifactType, resultId, taskId, consumption, outcome, appliedPaths, postcheck, recovery, completedAt plus one LF.
  - Result constants are schemaVersion 1, artifactType engineering-governance-self-upgrade-result-v1, resultId eg21-readiness4-result-1, this taskId, exact project-relative consumption path/sha256; outcome is SUCCEEDED, ROLLED_BACK, or RECOVERY_REQUIRED; appliedPaths is an ordered unique subset of the five absolute grant-write paths.
  - Result postcheck has exactly attempted, command, exitCode, stdoutPath, stdoutSha256, stderrPath, stderrSha256, policyVersion, policyDigest. attempted is boolean; when false every other postcheck value is null; when true command is the exact ordered string array below, exitCode is an integer, output paths and hashes are non-empty strings with 64-lowercase-hex hashes, and policyVersion/policyDigest are either both exact non-empty strings after policy inspection or both null if inspection could not complete.
  - Result recovery has exactly attempted, completed, command, exitCode, stdoutPath, stdoutSha256, stderrPath, stderrSha256. attempted/completed are booleans; when attempted is false completed is false and every other value is null; when attempted is true command is the exact ordered string array below, exitCode is integer or null only for interrupted execution, and all produced output paths/hashes are non-empty strings with 64-lowercase-hex hashes. No result key may be omitted. createdAt, attemptedAt, completedAt, issuedAt, and expiresAt values in all four artifacts are RFC3339 UTC strings ending in Z.
  - Beta postcheck command is exactly [/Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/bin/check-delivery-policy.sh]. stdoutPath is exactly upgrade-postcheck.stdout.json and stderrPath is exactly upgrade-postcheck.stderr.txt, resolved only below the task directory. SUCCEEDED requires attempted true, exitCode 0, raw-bound durable files, wrapper output valid true and errors exactly empty, managed policy inspection yielding policyVersion 2.1.0-beta.0 and policyDigest fed49384b550c0309ae5ec397d4a920c6402c28703cc471790e34fe6611cb562, appliedPaths exactly all five paths, and recovery attempted/completed false with every other recovery value null.
  - Old-runner recovery command is exactly [/Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/bin/check-delivery-policy.sh]. stdoutPath is exactly upgrade-recovery.stdout.json and stderrPath is exactly upgrade-recovery.stderr.txt, resolved only below the task directory. ROLLED_BACK requires recovery attempted/completed true, exitCode 0, raw-bound durable files, managed policy inspection yielding policyVersion 2.0.0 and policyDigest 258befcfe9f8d24f8ba031e8a99941043e7fbfaba557a16949b10169fd02205f, old wrapper valid true/errors empty, and exact restoration of all five before bytes/modes/absence. RECOVERY_REQUIRED requires recovery attempted true and completed false or nonzero/null exit and retains every produced failure record.
  - Verify-only argv is exactly node scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode verify-only --project /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id global-sop-2-1-beta-self-upgrade-readiness-4 --grant /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-apply-grant.json.
  - Apply argv is exactly node scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode apply --project /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id global-sop-2-1-beta-self-upgrade-readiness-4 --grant /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-apply-grant.json --archive /Users/xgh/Documents/VibeCoding/EngineeringGovernanceReleaseCandidates/2.1.0-beta.0/engineering-governance-2.1.0-beta.0.tgz --plan-digest 45060ce307993ca1e260591030ea1745bbdc73ab11c92eb23beacf5c070f944c.
  - Recover argv is exactly node scripts/self-upgrade/apply-reviewed-self-upgrade.mjs --mode recover --project /Users/xgh/Documents/VibeCoding/EngineeringGovernance --task-id global-sop-2-1-beta-self-upgrade-readiness-4 --consumption /Users/xgh/Documents/VibeCoding/EngineeringGovernance/.delivery/tasks/global-sop-2-1-beta-self-upgrade-readiness-4/upgrade-consumption.json.
  - Verify-only is read-only and permitted during IN_PROGRESS. Apply requires this task CLOSED, active unconsumed grant, exact accepted contract review/candidate/verification/implementation review/closure/ledger bindings, exact archive/plan/before identities, complete fsynced backup, and absent consumption/result files.
  - Apply creates consumption before mutation, executes the exact beta plan once, captures durable beta postcheck output, and records SUCCEEDED only under the exact beta version/digest conditions above.
  - Any apply/postcheck failure restores managed paths in reverse order to exact backup bytes/modes/absence, captures durable restored old-runner output, and records ROLLED_BACK only under the exact old version/digest conditions above; otherwise record RECOVERY_REQUIRED and stop.
  - Recover is allowed only when consumption exists and SUCCEEDED is absent; it never applies the beta plan, may run after grant expiry, is idempotent after ROLLED_BACK, restores only from the bound backup, and can produce only ROLLED_BACK or RECOVERY_REQUIRED.
  - Any consumption file makes verify-only/apply/retry fail. A failed or interrupted attempt requires recover; ROLLED_BACK or RECOVERY_REQUIRED requires a new independently reviewed task and grant before any future apply.
  - After SUCCEEDED, immediately start a separate beta-pinned schema-v2 validation task; do not access ProjTrav or another consumer until that task is independently accepted and CLOSED.
nonGoals:
  - Do not apply the real upgrade, create backup/consumption/result artifacts, or run recover inside this readiness task or its evidence commands.
  - Do not alter src, dist, released schemas, adapters, templates, skills, VERSION, package.json, scripts/build-runner-bundle.mjs, released archive bytes, release-6 artifacts, or any governance identity source.
  - Do not create the beta post-upgrade task before a successful apply, and do not migrate ProjTrav, NoMe, or any consumer in this task.
  - Do not publish, push, deploy, restart services, mutate persistent data, communicate externally, access remote systems, or inspect TREK implementation material.
  - Do not infer broader or standing authority, reissue or extend the frozen grant, reuse a consumed grant, silently replan, or continue after RECOVERY_REQUIRED.
