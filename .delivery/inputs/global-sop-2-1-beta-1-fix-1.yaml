schemaVersion: 2
taskId: global-sop-2-1-beta-1-fix-1
implementationOwner: codex
objective: >-
  Produce the Engineering Governance 2.1.0-beta.1 fix1 source candidate that
  prevents incomplete contracts from entering implementation and introduces a
  strict, mechanically enforced accountability system. The system binds stable
  actor identity, culpable review findings, penalty standing, role eligibility,
  remediation, and reinstatement to append-only evidence. This is a bootstrap
  remediation task under the still-pinned 2.0.0 policy; release packaging,
  self-upgrade, and consumer migration remain separately reviewed tasks.
scope:
  - Treat codex as the contract author and implementation owner of this exact bootstrap task; the accepted contract reviewer and later implementation reviewer must each be distinct local-claim actors and neither may be codex or independent-contract-reviewer.
  - Bump source VERSION and package.json from 2.1.0-beta.0 to exactly 2.1.0-beta.1 while preserving all 2.0.0 and 2.1.0-beta.0 terminal histories and release records as checkable historical artifacts.
  - Add a read-only `sop task preflight --project <absolute-project-path> --input <absolute-input-path>` command that validates and freezes contract completeness before `task start` may create a task.
  - Require `sop task start --project <absolute-project-path> --input <absolute-input-path> --preflight-plan <digest>` for every new beta1 mutating task; recompute the preflight and reject a missing, stale, forged, cross-project, cross-input, or changed-byte plan without creating a task directory or mutating a ledger.
  - Require every new beta1 mutating input and generated contract to contain normalized contractAuthor, an exact contractPreflight binding, and structured designBindings covering deliverables, authorities, constants, equalities, transitions, actor roles, and artifact kinds.
  - Make preflight require exact unique IDs, resolvable references, complete acceptance coverage, empty openChoices, contained regular non-symlink authority paths, raw-SHA binding for absolute external files, and explicit positive, negative, evidence, state, trust, recovery, and compatibility observations applicable to the task risk.
  - Add a policy-anchored local-claim actor registry and append-only accountability event chain; actor IDs are immutable, aliases are unique, and actor add, alias change, revocation, sanction override, or reinstatement requires exact user authorization.
  - >-
    Attribute culpable findings mechanically by frozen role and origin bindings: contract violations to contractAuthor, implementation defects to implementationOwner, and a defect provably present in previously accepted bytes to the reviewer who missed it; new requirements and tool defects score zero.
  - Enforce strict standing and role permissions at preflight and every start, transition, contract-review, implementation-review, repair, and close boundary so aliases, mid-task sanctions, stale plans, caller labels, direct ledger edits, and cross-task artifacts cannot bypass restrictions.
  - Bootstrap the current incident as codex active score 12 and SUSPENDED, and independent-contract-reviewer active score 8 and PROBATION; permit codex to complete only this exact user-authorized fix1 remediation task under the frozen exception.
  - Require permanent defect-class gates, supervised clean calibrations at equal-or-higher risk, and exact user-authorized evidence-bound reinstatement events before a restricted actor can regain permissions; rewards never waive or substitute for any core gate.
  - Add exact schemas, source validators, CLI behavior, documentation, templates, scripts, and adversarial unit/integration tests for preflight, identity, attribution, sanctions, recovery, compatibility, and bootstrap results.
nonGoals:
  - Do not build or install a 2.1.0-beta.1 runner archive, publish or push a package, apply a policy self-upgrade, migrate any consumer, or change ProjTrav or NoMe.
  - Do not deploy, restart services, mutate production or persistent product data, communicate externally, or use registry credentials.
  - Do not inspect, adapt, copy, allocate, or authorize TREK implementation material; external-source mode remains independent.
  - Do not rewrite, delete, relabel, or replace beta0 contracts, reviews, ledgers, evidence, candidates, release receipts, release records, or archive bytes.
  - Do not claim cryptographic human authentication; registry identity and user authorization remain explicit local claims.
  - Do not use reward points, reliability labels, supervisor claims, or remediation activity to waive contract readiness, fresh evidence, independent review, authorization, provenance, runtime, cloud, production, or risk gates.
