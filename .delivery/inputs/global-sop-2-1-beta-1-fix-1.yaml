acceptance:
  - id: FIX1-PREFLIGHT-SCHEMA
    observation: >-
      Beta1 task input, task contract, and preflight output use exact schemas
      and exact-key semantic validation. A successful preflight deterministically
      binds project policy, project root, input raw SHA-256 and semantic digest,
      repository baselines, contractAuthor, designBindings, derived risk,
      required gates, authorization requirements, and the resulting start plan.
    positiveCases:
      - New beta1 mutating inputs require schemaVersion 2, taskId, contractAuthor, implementationOwner, objective, scope, nonGoals, authorityInputs, repositories, acceptance, authorizationRequirements, evidenceFreshnessMs, designBindings, openChoices, and signals; generated contracts additionally require sopVersion, policyDigest, contractDigest, risk, riskSignals, contractPreflight, and extensions.
      - contractPreflight is exactly schemaVersion, artifactType engineering-governance-contract-preflight-v1, taskId, projectRoot, policyVersion, policyDigest, inputRawSha256, inputSemanticDigest, contractSemanticDigest, repositoryBaselines, checks, and planDigest; every digest is recomputed and planDigest is canonical structured-document SHA-256 excluding itself.
      - designBindings is exactly deliverables, authorities, constants, equalities, transitions, actorRoles, and artifactKinds; each collection has non-empty unique IDs, exact allowed keys and types, deterministic ID order, and no unknown, duplicate, dangling, or unused reference.
      - Every deliverable binds repositoryId, relative contained path, kind, schema or explicit none, and artifactType or explicit none; every authority binds a contained regular non-symlink path or an absolute external regular file plus raw SHA-256; every typed constant has one canonical value and source.
      - Every equality binds two declared field references and comparison mode exact-string, canonical-semantic-digest, raw-sha256, ordered-set, or normalized-actor; transitions bind from, to, actorRole, required artifact kinds, and authorization IDs.
      - Every acceptance item declares non-empty bindingRefs and collectively references every design binding at least once; all positive and negative cases are non-empty, required gates equal acceptance IDs, and openChoices is exactly empty.
    negativeCases:
      - Null, array, schema-only, missing nested object, empty list, wrong type, unknown key, duplicate ID, dangling reference, unused binding, path traversal, symlink, directory, missing file, unhashed absolute input, unbound constant, unresolved choice, risk downgrade, or summary-only acceptance passes or throws TypeError.
      - Formatting-only input changes preserve semantic digest but change raw SHA and therefore invalidate the start plan; no caller-supplied digest or state label is trusted.
    evidenceKind: unit
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [exec, vitest, run, tests/unit/contract-preflight.test.ts]
      environment: { PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin }
    observerPolicy: { expectedExitCode: 0, output: nonempty, checkoutMutation: forbidden, replay: required }
  - id: FIX1-PREFLIGHT-CLI
    observation: >-
      The real beta1 CLI preflight is read-only and task start consumes only an
      exact freshly recomputed successful preflight plan. Failure leaves task,
      ledger, authorization-consumption, and command-execution bytes unchanged.
    positiveCases:
      - >-
        `sop task preflight --project <absolute> --input <absolute>` emits one canonical JSON result, exits zero only when valid true, and performs zero checkout writes.
      - >-
        `sop task start --project <absolute> --input <absolute> --preflight-plan <digest>` recomputes the same preflight, requires exact digest equality, remains dry-run-first, and only an explicit apply of that exact start plan creates contract.yaml and sequence-1 ledger state.
      - Actor eligibility, risk, repository baselines, authority identities, authorization requirements, and input raw bytes are checked both when preflight is produced and when start is applied.
    negativeCases:
      - Missing preflight-plan, failed preflight, stale or forged digest, formatting-byte drift, cross-project, cross-input, cross-task, changed policy, changed authority, changed repository baseline, suspended author or owner, or expired authorization creates a directory, appends a ledger, executes acceptance commands, or crashes.
      - Legacy active-command flags, direct internal helper calls, aliases, symlinks, traversal, and precreated task directories bypass preflight.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [exec, vitest, run, tests/integration/contract-preflight-cli.test.ts]
      environment: { PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin }
    observerPolicy: { expectedExitCode: 0, output: nonempty, checkoutMutation: forbidden, replay: required }
  - id: FIX1-ACTOR-REGISTRY
    observation: >-
      Actor identity is derived from a policy-anchored append-only local-claim
      registry, not caller strings. Canonical actor ID, aliases, status, event
      order, authorization, and chain digests are recomputed on every use.
    positiveCases:
      - >-
        `.delivery/accountability/actors.jsonl` contains exact schema-valid actor-created, alias-added, actor-revoked, and actor-restored events with sequence, priorEventDigest, eventDigest, canonical actorId, aliases, authorization binding, actor, and occurredAt.
      - >-
        `.delivery/policy.yaml` binds the registry path, accountability event path, strict-v1 ruleset, and exact genesis digest; sequence 1 uses that genesis and every later event binds the previous event digest.
      - Normalization is trim plus Unicode NFKC plus lowercase; canonical actor IDs are immutable, normalized aliases are globally unique, and every event actor and authorization subject resolves to one active canonical ID.
      - Add, alias, revoke, restore, or identity correction requires a valid non-expired task/action/target/scope-bound user authorization; consume-once authorization cannot be replayed.
    negativeCases:
      - Unknown actor, duplicate or confusable alias, rename to evade sanctions, reordered/omitted/duplicated event, forged prior digest, caller-selected canonical ID, stale authorization, symlink registry, malformed JSONL, unknown key, or partial event passes validation.
      - The local registry is represented as cryptographic proof of a human or permits one actor to claim another actor's privileges.
    evidenceKind: unit
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [exec, vitest, run, tests/unit/actor-registry.test.ts]
      environment: { PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin }
    observerPolicy: { expectedExitCode: 0, output: nonempty, checkoutMutation: forbidden, replay: required }
  - id: FIX1-ACCOUNTABILITY-POLICY
    observation: >-
      Accountability is deterministically derived from canonical findings and
      immutable role/origin evidence. Scoring, immediate sanctions, standing,
      attribution, repeat detection, and permissions have one exact strict-v1
      interpretation and cannot be weakened by project configuration.
    positiveCases:
      - Each culpable finding records exact findingId, severity, classification, defectClass, responsibleRole, responsibleActorId, culpability, origin task/candidate/review identities, evidenceRefs, and policyVersion; duplicate accounting for one finding identity is rejected.
      - BLOCKER scores 8, HIGH 5, MEDIUM 3, LOW 1; a repeated unresolved normalized defectClass adds 4; evidence-forgery, identity-evasion, authorization-bypass, and prohibited-mutation cause immediate SUSPENDED regardless of numeric score.
      - activePenaltyScore maps 0-4 GOOD_STANDING, 5-7 WATCH, 8-11 PROBATION, and 12 or more SUSPENDED unless a later valid reinstatement event explicitly changes both score and standing; lifetimePenaltyScore never decreases.
      - A culpable contract_violation binds responsibleRole contractAuthor; a culpable newly_discovered_defect binds implementationOwner unless evidence proves the same defect existed in bytes accepted by a prior review, in which case missed_existing_blocker binds that prior reviewer; new_requirement and proven tool_defect score zero.
      - GOOD_STANDING has normal role eligibility but no gate waiver. WATCH cannot author, own, or review R3 and may perform R1/R2 only with a distinct GOOD_STANDING supervisor and exact authorization. PROBATION has no normal mutating author, owner, or reviewer role and may act only as an authorized supervised remediation worker. SUSPENDED is R0/read-only except one exact authorized supervised remediation task.
      - For future beta1 R2/R3 tasks, contractAuthor, implementationOwner, contract reviewer, and implementation reviewer are four normalized distinct registered actors in GOOD_STANDING; no self-review or alias-equivalent role reuse is allowed.
    negativeCases:
      - A prose finding, aggregate count, reviewer summary, severity downgrade, unclassified or unknown classification, missing origin bytes, caller-selected responsible actor, unproven blame transfer, duplicate event, tiny clean task, time passage, alias change, project extension, or reward reduces a sanction or authorizes a role.
      - ACCEPTED review with a culpable finding, REPAIR_REQUIRED without a consolidated finding set, unscored blocking finding, or orphan accountability event passes policy or graph validation.
    evidenceKind: unit
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [exec, vitest, run, tests/unit/accountability-policy.test.ts]
      environment: { PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin }
    observerPolicy: { expectedExitCode: 0, output: nonempty, checkoutMutation: forbidden, replay: required }
  - id: FIX1-SANCTIONS-ENFORCEMENT
    observation: >-
      Real CLI, ledger, and task-graph paths recompute status and fail closed at
      every role-bearing boundary. A sanction applied after task start takes
      effect before the next transition and cannot be bypassed through stale
      plans, direct artifacts, aliases, or caller-controlled role labels.
    positiveCases:
      - Preflight, start apply, DEFINED to IN_PROGRESS, contract review, candidate declaration, implementation review, repair, ACCEPTED to CLOSED, and graph check resolve all actors through the registry and enforce current standing plus exact task authorization.
      - Canonical contract and implementation review schemas require accountability attribution for every finding; semantic validation recomputes role binding, origin, culpability, score delta, standing effect, and matching append-only accountability event.
      - >-
        `.delivery/accountability/events.jsonl` is path-contained, regular, non-symlink, exact-schema JSONL with sequence, priorEventDigest, eventDigest, source artifact raw SHA and semantic digest, affected actor, score delta, resulting status, and authorization or explicit none.
      - >-
        `sop accountability status --project <absolute> --actor <id-or-alias>` emits recomputed canonical JSON including lifetime score, active score, standing, permissions, unresolved defect classes, calibration progress, and source event identities.
    negativeCases:
      - Mid-task suspension, stale dry-run plan, stale contract review, direct ledger append, forged accepted review, missing accountability event, orphan event, cross-task source, reviewer/event actor mismatch, alias-equivalent role, symlink, traversal, partial JSONL, wrong order, or caller-supplied standing permits a mutation or returns valid true.
      - Invalid inputs throw TypeError, execute acceptance commands, consume authorization, or partially mutate registry, accountability, task, or ledger files.
    evidenceKind: integration
    command:
      repositoryId: root
      cwd: .
      executable: /opt/homebrew/bin/pnpm
      arguments: [exec, vitest, run, tests/integration/accountability-enforcement.test.ts]
      environment: { PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/bin:/bin }
