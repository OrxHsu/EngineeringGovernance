  - id: FIX1-REINSTATEMENT
    observation: >-
      Restriction recovery is slow, supervised, risk-matched, defect-specific,
      evidence-bound, and user-authorized. Recognition is allowed only after
      reliability is proven and never changes mandatory gates.
    positiveCases:
      - SUSPENDED to PROBATION requires one user-approved remediation that installs a permanent executable gate for every unresolved repeated defectClass plus three consecutive supervised first-pass clean tasks or reviews at equal-or-higher risk; the reinstatement event sets active score 8 while retaining lifetime score.
      - PROBATION to WATCH requires two additional consecutive supervised first-pass clean equal-or-higher-risk tasks or reviews and sets active score 5; WATCH to GOOD_STANDING requires two additional consecutive first-pass clean independently reviewed R2/R3 tasks and sets active score 0.
      - Any blocker, repair-required decision, evidence mismatch, authorization failure, missed existing blocker, supervision failure, or sequence gap resets the current calibration stage; R0/R1 volume cannot satisfy R2/R3 or R3 calibration.
