objective: Produce the Engineering Governance 2.1.0-beta.1 fix1 source candidate
  that prevents incomplete contracts from entering implementation and introduces
  a strict, mechanically enforced accountability system. The system binds stable
  actor identity, culpable review findings, penalty standing, role eligibility,
  remediation, and reinstatement to append-only evidence. This is a bootstrap
  remediation task under the still-pinned 2.0.0 policy; release packaging,
  self-upgrade, and consumer migration remain separately reviewed tasks.
scope:
  - Treat codex as the contract author and implementation owner of this exact
    bootstrap task, user-authority as the GOOD_STANDING remediation supervisor,
    independent-contract-reviewer-fix1 as the contract reviewer, and
    independent-implementation-reviewer-fix1 as the later implementation
    reviewer; all four normalized IDs are distinct except the explicitly
    bootstrap-authorized codex author/owner combination, and none is an alias of
    independent-contract-reviewer.
  - Bump source VERSION and package.json from 2.1.0-beta.0 to exactly
    2.1.0-beta.1 while preserving all 2.0.0 and 2.1.0-beta.0 terminal histories
    and release records as checkable historical artifacts.
  - Add a read-only `sop task preflight --project <absolute-project-path>
    --input <absolute-input-path>` command that validates and freezes contract
    completeness before `task start` may create a task.
  - Require `sop task start --project <absolute-project-path> --input
    <absolute-input-path> --preflight-plan <preflightDigest>` to produce a dry
    start plan and the same command plus `--apply-plan <startPlanDigest>` to
    create artifacts; both digests are recomputed and a missing, stale, forged,
    cross-project, cross-input, or changed-byte digest fails without task,
    ledger, authorization, or command mutation.
  - Require every new beta1 mutating input and generated contract to contain
    normalized contractAuthor, an exact contractPreflight binding, and
    structured designBindings covering deliverables, authorities, constants,
    equalities, transitions, actor roles, and artifact kinds.
  - Make preflight require exact unique IDs, resolvable references, complete
    acceptance coverage, empty openChoices, contained regular non-symlink
    authority paths, raw-SHA binding for absolute external files, and explicit
    positive, negative, evidence, state, trust, recovery, and compatibility
    observations applicable to the task risk.
  - Add a policy-anchored local-claim actor registry and append-only
    accountability event chain; actor IDs are immutable, aliases are unique, and
    actor add, alias change, revocation, sanction override, or reinstatement
    requires exact user authorization.
  - "Attribute culpable findings mechanically by frozen role and origin
    bindings: contract violations to contractAuthor, implementation defects to
    implementationOwner, and a defect provably present in previously accepted
    bytes to the reviewer who missed it; new requirements and tool defects score
    zero."
  - Enforce strict standing and role permissions at preflight and every start,
    transition, contract-review, implementation-review, repair, and close
    boundary so aliases, mid-task sanctions, stale plans, caller labels, direct
    ledger edits, and cross-task artifacts cannot bypass restrictions.
  - Bootstrap the current incident as codex active score 20 and SUSPENDED, and
    independent-contract-reviewer active score 8 and PROBATION; permit codex to
    complete only this exact user-authorized fix1 remediation task under the
    frozen exception.
  - "Preserve the predecessor repair chain as authority: the original fix1
    contract, canonical contract-review.yaml and superseding ledger, plus the
    repair-1 and repair-2 contracts and superseding ledgers remain immutable
    evidence for this repair-3 task."
  - "Add exactly these new schema deliverables:
    schemas/task-start-input.schema.json,
    schemas/contract-preflight.schema.json,
    schemas/actor-registry-event.schema.json,
    schemas/accountability-event.schema.json,
    schemas/accountability-status.schema.json, and
    schemas/accountability-bootstrap.schema.json. Their artifactType constants
    are respectively not-applicable input document,
    engineering-governance-contract-preflight-v1,
    engineering-governance-actor-registry-event-v1,
    engineering-governance-accountability-event-v1,
    engineering-governance-accountability-status-v1, and
    engineering-governance-accountability-bootstrap-v1; extend existing
    project-policy, task-contract, contract-review, review, authorization, and
    task-event schemas without replacing historical variants."
  - "Add exactly these new source and command deliverables:
    src/accountability/registry.ts, src/accountability/policy.ts,
    src/accountability/derive.ts, src/accountability/enforce.ts,
    src/accountability/preflight.ts, src/commands/task-preflight.ts,
    src/commands/accountability-status.ts, and
    scripts/verify-accountability-bootstrap.mjs; update the existing CLI,
    lifecycle, graph, policy loader, model types, docs, templates, generated
    dist, and delivery-sop skill only where required by the frozen behavior."
  - Freeze project policy accountability keys as ruleset, registryPath,
    eventsPath, and genesisDigest with exact values strict-v1,
    .delivery/accountability/actors.jsonl,
    .delivery/accountability/events.jsonl, and
    c6043b1735ad12fa345400d16a9d34c722cea5952821d5e8f00023841d5a9071; that
    genesis is SHA-256 of the exact UTF-8 bytes
    `engineering-governance-accountability-genesis-v1\nstrict-v1\n`.
  - "Freeze designBindings item keys and enums: deliverables use id,
    repositoryId, path, kind, schemaRef, artifactType with kind source, schema,
    document, template, test, script, or generated; authorities use id,
    location, repositoryId, path, rawSha256, semanticDigest with location
    repository or external; constants use id, valueType, value, sourceRef with
    valueType string, integer, boolean, digest, path, or state; equalities use
    id, leftRef, rightRef, comparison with comparison exact_string,
    canonical_semantic_digest, raw_sha256, ordered_set, or normalized_actor;
    transitions use id, from, to, actorRoleRef, artifactKindRefs,
    authorizationRefs; actorRoles use id, actorId, requiredStanding,
    distinctFrom with requiredStanding GOOD_STANDING, WATCH, PROBATION, or
    SUSPENDED; artifactKinds use id, pathPattern, schemaRef, minimumCount,
    maximumCount with non-negative integer counts. Explicit string `none` is
    used where a schema, artifactType, repositoryId, digest, actorId, or
    maximumCount is inapplicable."
  - Freeze preflight checks in exact order as input_schema,
    authority_resolvability, design_binding_schema, design_binding_references,
    acceptance_coverage, risk_classification, actor_eligibility, authorization,
    repository_baselines, and open_choices; every check is PASS with non-empty
    evidence or preflight is invalid.
  - "Freeze beta1 finding enums and history mapping: responsibleRole is
    contract_author, implementation_owner, contract_reviewer,
    implementation_reviewer, tool, or none; culpability is culpable,
    non_culpable_new_requirement, non_culpable_tool_defect, or
    missed_existing_blocker; new beta1 findings use BLOCKER, HIGH, MEDIUM, LOW,
    while inspect-only pre-beta1 P0, P1, P2, P3 map exactly to BLOCKER, HIGH,
    MEDIUM, LOW and cannot be authored by beta1 commands."
  - Freeze actor-registry event common keys as schemaVersion, artifactType,
    eventType, sequence, priorEventDigest, eventDigest, policyDigest, actorId,
    aliases, authorization, actor, and occurredAt. Freeze accountability event
    common keys as schemaVersion, artifactType, eventType, sequence,
    priorEventDigest, eventDigest, policyDigest, subjectActorId, source, score,
    lifetimePenaltyScore, activePenaltyScore, standing, permissions,
    authorization, and occurredAt; source is exactly taskId, artifactPath,
    rawSha256, semanticDigest, reviewId, and findingId, using explicit string
    none only where frozen as inapplicable, and score is exactly base,
    repeatSurcharge, immediateSuspension, and delta. Event-specific schemas may
    require narrower payload values but may not add undeclared top-level keys.
  - Freeze accountability status output keys as schemaVersion, artifactType,
    policyVersion, actorId, aliases, lifetimePenaltyScore, activePenaltyScore,
    standing, permissions, unresolvedDefectClasses, calibration, recognition,
    and sourceEvents. calibration is exactly currentStage,
    consecutiveCleanCount, requiredCleanCount, qualifyingRefs, and lastResetRef;
    recognition is exactly status, grantedByEvent, and revokedByEvent; each
    sourceEvents item is exactly sequence, eventDigest, eventType, and
    sourceRef.
  - Freeze accountability bootstrap keys as schemaVersion, artifactType,
    policyVersion, taskId, sources, findings, actors, and remediationException.
    Each source is exactly id, kind, path, rawSha256, and semanticDigest with
    kind contract, review, ledger, or report; each finding uses the exact beta1
    finding and origin structure; each actor is exactly actorId, aliases,
    lifetimePenaltyScore, activePenaltyScore, standing, permissions, and
    unresolvedDefectClasses; remediationException is exactly authorizationPath,
    authorizationRawSha256, authorizationSemanticDigest, taskId, action,
    supervisorId, contractReviewerId, implementationReviewerId, issuedAt,
    expiresAt, and consumeOnce.
  - "Freeze contract repair semantics: a failed preflight creates no task; a
    DEFINED contract review with REPAIR_REQUIRED is persisted and the task
    transitions DEFINED to SUPERSEDED with that contract-review artifact; a
    repaired contract requires a new taskId and exact predecessor binding.
    Ledger REPAIR_REQUIRED remains reserved for a CANDIDATE implementation
    review and no contract or ledger history is rewritten."
  - Add the authorization schema variant
    engineering-governance-remediation-authorization-v1 without changing legacy
    or sop-authorization-v2 validation. Its exact required top-level keys are
    schemaVersion, artifactType, authorizationId, requirementId, taskId,
    contract, grantor, action, target, scope, supervisorId, contractReviewerId,
    implementationReviewerId, issuedAt, expiresAt, consumeOnce, and status;
    contract is exactly path, rawSha256, and semanticDigest, and grantor is
    exactly id, role, and trustLevel. Bind the bootstrap authorization to
    .delivery/tasks/global-sop-2-1-beta-1-fix-1-repair-3/authorizations/AUTH-EG21-BETA1-FIX1-REMEDIATION.json,
    supervisorId user-authority, contractReviewerId
    independent-contract-reviewer-fix1, and implementationReviewerId
    independent-implementation-reviewer-fix1; the exception cannot resolve any
    other task, role, path, actor, or action.
  - Require permanent defect-class gates, supervised clean calibrations at
    equal-or-higher risk, and exact user-authorized evidence-bound reinstatement
    events before a restricted actor can regain permissions; rewards never waive
    or substitute for any core gate.
  - Add exact schemas, source validators, CLI behavior, documentation,
    templates, scripts, and adversarial unit/integration tests for preflight,
    identity, attribution, sanctions, recovery, compatibility, and bootstrap
    results.
nonGoals:
  - Do not build or install a 2.1.0-beta.1 runner archive, publish or push a
    package, apply a policy self-upgrade, migrate any consumer, or change
    ProjTrav or NoMe.
  - Do not deploy, restart services, mutate production or persistent product
    data, communicate externally, or use registry credentials.
  - Do not inspect, adapt, copy, allocate, or authorize TREK implementation
    material; external-source mode remains independent.
  - Do not rewrite, delete, relabel, or replace beta0 contracts, reviews,
    ledgers, evidence, candidates, release receipts, release records, or archive
    bytes.
  - Do not claim cryptographic human authentication; registry identity and user
    authorization remain explicit local claims.
  - Do not use reward points, reliability labels, supervisor claims, or
    remediation activity to waive contract readiness, fresh evidence,
    independent review, authorization, provenance, runtime, cloud, production,
    or risk gates.
