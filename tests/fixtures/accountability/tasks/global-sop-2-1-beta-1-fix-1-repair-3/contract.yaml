  - id: FIX1-ACCOUNTABILITY-POLICY
    observation: Accountability is deterministically derived from canonical findings
      and immutable role/origin evidence. Scoring, immediate sanctions,
      standing, attribution, repeat detection, and permissions have one exact
      strict-v1 interpretation and cannot be weakened by project configuration.
    positiveCases:
      - Each finding records exact findingId, severity, classification,
        defectClass, responsibleRole, responsibleActorId or none, culpability,
        origin containing taskId, artifactPath, rawSha256, semanticDigest,
        reviewId or none, evidenceRefs, and policyVersion; responsibleRole and
        culpability use only the frozen enums and duplicate accounting for one
        origin/review/finding identity is rejected.
      - BLOCKER scores 8, HIGH 5, MEDIUM 3, LOW 1; a repeated unresolved
        normalized defectClass adds 4; evidence-forgery, identity-evasion,
        authorization-bypass, and prohibited-mutation cause immediate SUSPENDED
        regardless of numeric score.
      - activePenaltyScore maps 0-4 GOOD_STANDING, 5-7 WATCH, 8-11 PROBATION,
        and 12 or more SUSPENDED unless a later valid reinstatement event
        explicitly changes both score and standing; lifetimePenaltyScore never
        decreases.
      - A culpable contract_violation binds responsibleRole contractAuthor; a
        culpable newly_discovered_defect binds implementationOwner unless
        evidence proves the same defect existed in bytes accepted by a prior
        review, in which case missed_existing_blocker binds that prior reviewer;
        new_requirement and proven tool_defect score zero.
      - GOOD_STANDING has normal role eligibility but no gate waiver. WATCH
        cannot author, own, or review R3 and may perform R1/R2 only with a
        distinct GOOD_STANDING supervisor and exact authorization. PROBATION has
        no normal mutating author, owner, or reviewer role and may act only as
        an authorized supervised remediation worker. SUSPENDED is R0/read-only
        except one exact authorized supervised remediation task.
      - For future beta1 R2/R3 tasks, contractAuthor, implementationOwner,
        contract reviewer, and implementation reviewer are four normalized
        distinct registered actors in GOOD_STANDING; no self-review or
        alias-equivalent role reuse is allowed.
      - New beta1 contract and implementation reviews author only BLOCKER, HIGH,
        MEDIUM, LOW. Historical P0, P1, P2, P3 findings are inspect-only and map
        exactly to BLOCKER, HIGH, MEDIUM, LOW for recomputation without changing
        historical bytes.
    negativeCases:
      - A prose finding, aggregate count, reviewer summary, severity downgrade,
        unclassified or unknown classification, missing origin bytes,
        caller-selected responsible actor, unproven blame transfer, duplicate
        event, tiny clean task, time passage, alias change, project extension,
        or reward reduces a sanction or authorizes a role.
      - ACCEPTED review with a culpable finding, REPAIR_REQUIRED without a
        consolidated finding set, unscored blocking finding, or orphan
        accountability event passes policy or graph validation.
