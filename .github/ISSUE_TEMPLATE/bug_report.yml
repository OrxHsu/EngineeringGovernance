name: Bug report
description: Report a reproducible behavior problem.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: Include Node, pnpm, OS, and the exact redacted command.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
