name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec vitest run --shard=1/4
      - run: pnpm exec vitest run --shard=2/4
      - run: pnpm exec vitest run --shard=3/4
      - run: pnpm exec vitest run --shard=4/4
      - run: pnpm build
      - run: pnpm check:placeholders
      - run: pnpm check:licenses
