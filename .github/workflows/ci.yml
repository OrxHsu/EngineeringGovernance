name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec vitest run --shard=1/4
      - run: pnpm exec vitest run --shard=2/4
      - run: pnpm exec vitest run --shard=3/4
      - run: pnpm exec vitest run --shard=4/4 --exclude tests/unit/task-graph-v2.test.ts --exclude tests/integration/cli-v2-hardening.test.ts
      - run: pnpm exec vitest run tests/unit/task-graph-v2.test.ts --testNamePattern='rejects'
      - run: pnpm exec vitest run tests/unit/task-graph-v2.test.ts --testNamePattern='(accepts|reports|keeps|surfaces)'
      - run: pnpm exec vitest run tests/integration/cli-v2-hardening.test.ts --testNamePattern='(returns|starts|verifies|executes|uses)'
      - run: pnpm exec vitest run tests/integration/cli-v2-hardening.test.ts --testNamePattern='(rejects|inspects|keeps|applies)'
      - run: pnpm build
      - run: pnpm check:placeholders
      - run: pnpm check:licenses
